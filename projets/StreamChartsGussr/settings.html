<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StreamGuessr — réglages : thème, langue et cache local." />
  <title>StreamGuessr</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header class="site-header aero">
    <nav class="header-left">
      <a class="icon-btn" href="index.html"
         data-i18n-title="nav.back" data-i18n-aria-label="nav.back"
         aria-label="Retour" title="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5"></path>
          <path d="m12 19-7-7 7-7"></path>
        </svg>
      </a>
      <span class="brand-mini"><strong data-i18n="settings.title"></strong></span>
    </nav>
  </header>

  <main class="page-wrap settings-page">
    <section class="settings-card aero reveal-on-load">
      <h2 data-i18n="settings.theme"></h2>
      <div class="segmented" role="group" data-i18n-aria-label="settings.theme" aria-label="Thème">
        <button class="segment theme-btn" type="button" data-theme="dark" aria-pressed="false"
                data-i18n="settings.themeDark">Sombre</button>
        <button class="segment theme-btn" type="button" data-theme="light" aria-pressed="false"
                data-i18n="settings.themeLight">Clair</button>
      </div>
    </section>

    <section class="settings-card aero reveal-on-load">
      <h2 data-i18n="settings.language"></h2>
      <select id="langSelect" class="input select">
        <option value="fr" data-i18n="settings.langFr">Français</option>
        <option value="en" data-i18n="settings.langEn">English</option>
      </select>
    </section>

    <section class="settings-card aero reveal-on-load">
      <h2 data-i18n="settings.cacheTitle"></h2>
      <p class="settings-desc" data-i18n="settings.cacheDesc"></p>
      <p id="cacheStats" class="cache-stats"></p>
      <button id="clearCacheBtn" class="btn danger" type="button" data-i18n="settings.clearCache"></button>
    </section>

         <section class="settings-card aero reveal-on-load">
      <h2 data-i18n="settings.sourceTitle"></h2>
      <p class="settings-desc" data-i18n="settings.sourceDesc"></p>
      <a class="btn ghost" href="https://sullygnome.com/" target="_blank" rel="noopener noreferrer"
         data-i18n="settings.sourceLink">sullygnome.com</a>

      <label class="field-label" for="proxyUrlInput" data-i18n="settings.proxyLabel"></label>
      <input id="proxyUrlInput" class="input" type="url" spellcheck="false"
             data-i18n-placeholder="settings.proxyPlaceholder" />
      <p class="settings-desc" data-i18n="settings.proxyHint"></p>

      <label class="toggle-row" for="useAlloriginsToggle">
        <input id="useAlloriginsToggle" type="checkbox" class="toggle" />
        <span class="toggle-slider"></span>
        <span class="toggle-label" data-i18n="settings.useAllorigins"></span>
      </label>
      <p class="settings-desc" data-i18n="settings.useAlloriginsHint"></p>
    </section>
  </main>

  <script type="module" src="scripts/ui/settings-page.js"></script>
</body>
</html>
