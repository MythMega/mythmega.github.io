<body>
  <main class="container">
    <h1 id="title">Overlay Configurator</h1>
    <p id="intro">Créez un overlay pour OBS à partir d'un Google Spreadsheet contenant vos objectifs.</p>
    <div class="actions">
      <a class="btn" href="configurator.html" id="open-config">Créer son overlay</a>
    </div>
  </main>

  <script src="scripts/translation.js"></script>
  <script>
    // Traduction initiale
    const userLang = navigator.language && navigator.language.startsWith('fr') ? 'fr' : 'en';
    Translation.init(userLang).then(() => {
      document.getElementById('title').textContent = Translation.t('index.title');
      document.getElementById('intro').textContent = Translation.t('index.intro');
      document.getElementById('open-config').textContent = Translation.t('index.openConfigurator');

      // Mise à jour des balises OG / Twitter selon la langue
      const ogTitle = document.getElementById('og-title');
      const ogDesc = document.getElementById('og-description');
      const ogLocale = document.getElementById('og-locale');
      const twitterTitle = document.getElementById('twitter-title');
      const twitterDesc = document.getElementById('twitter-description');
      if (ogTitle) ogTitle.setAttribute('content', Translation.t('index.title'));
      if (ogDesc) ogDesc.setAttribute('content', Translation.t('index.metaDescription'));
      if (ogLocale) ogLocale.setAttribute('content', userLang === 'fr' ? 'fr_FR' : 'en_US');
      if (twitterTitle) twitterTitle.setAttribute('content', Translation.t('index.title'));
      if (twitterDesc) twitterDesc.setAttribute('content', Translation.t('index.metaDescription'));
    });
  </script>
