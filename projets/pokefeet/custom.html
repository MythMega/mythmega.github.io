<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#060c18" />
  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="Pokefeet" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pokefeet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <title>Pokefeet — Challenges Custom</title>
  <meta name="description" content="Pokefeet Challenges Custom — Créez et jouez vos propres challenges de devinettes de Pokémon par les pieds." />
  <meta name="keywords" content="Pokefeet, challenge custom, deviner Pokémon, pieds" />
  <meta name="author" content="MythMega" />
  <link rel="icon" type="image/x-icon" href="./icon.png">
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/cosmetics.css" />
  <link rel="stylesheet" href="styles/text-shadow.css" />
  <link rel="stylesheet" href="styles/custom-challenges.css" />
</head>
<body>
  <main id="app" class="custom-page">
    <div class="deco n1"></div>
    <div class="deco n2"></div>
    <div class="deco n3"></div>
    <div class="deco n4"></div>
    <div class="deco-secondary n11"></div>
    <div class="deco-secondary n12"></div>
    <header>
      <h1 data-i18n="custom.title">Challenges Custom</h1>
    </header>

    <section class="home-area">
      <div class="home-card" role="region" aria-labelledby="customTitle">
        <h2 id="customTitle" class="home-title" data-i18n="custom.choose">Que voulez-vous faire ?</h2>

        <a class="big-btn" href="custom_create.html" style="text-align:center;" data-tag="customizables-button" data-i18n="custom.create">Créer un challenge</a>
        <a class="big-btn secondary" href="custom_play.html" style="text-align:center;" data-tag="customizables-button" data-i18n="custom.play">Jouer un challenge</a>

        <div class="subtitle" data-i18n="custom.arcadeDesc">Mode arcade : aucune sauvegarde, ni XP, ni récompense. Juste du fun !</div>

        <a class="big-btn secondary" href="index.html" style="margin-top:8px; text-align:center;" data-i18n="common.backHome">Retour à l'accueil</a>
      </div>
    </section>
  </main>

  <script src="js/core/preferences.js"></script>
  <script src="js/ui/loader.js"></script>
  <script src="js/i18n/translate.js"></script>
  <script src="js/i18n/language-switcher.js"></script>
  <script src="js/ui/footer.js"></script>
  <script src="js/i18n/setup.js"></script>
  <script src="js/data/migration.js"></script>
  <script src="js/data/challenge-storage.js"></script>
  <script src="js/features/settings/cosmetics.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
