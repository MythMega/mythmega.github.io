<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#060c18" />
  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="Pokefeet" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pokefeet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <title>Pokefeet — Défis Passés</title>
  <meta name="description" content="Pokefeet — Rejouez vos anciens défis Daily et Weekly. Retrouvez tous les Pokémon des jours et semaines précédents." />
  <meta name="keywords" content="Pokefeet, défis passés, anciens daily, historique Pokémon" />
  <meta name="author" content="MythMega" />
  <link rel="canonical" href="https://web.jmdev.fr/projets/pokefeet/old_daily.html" />
  <link rel="alternate" href="https://web.jmdev.fr/projets/pokefeet/old_daily.html" hreflang="fr" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://web.jmdev.fr/projets/pokefeet/old_daily.html" />
  <meta property="og:title" content="Pokefeet — Défis Passés" />
  <meta property="og:description" content="Rejouez vos anciens défis Daily et Weekly Pokémon." />
  <meta property="og:site_name" content="MythMega — jmdev" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Pokefeet — Défis Passés" />
  <meta name="twitter:description" content="Rejouez vos anciens défis Daily et Weekly Pokémon." />
  <link rel="icon" type="image/x-icon" href="./icon.png">
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/cosmetics.css" />
  <link rel="stylesheet" href="styles/text-shadow.css" />
</head>

<body>
  <main id="app">
    <div class="deco n1"></div>
    <div class="deco n2"></div>
    <div class="deco n3"></div>
    <div class="deco n4"></div>
    <div class="deco-secondary n11"></div>
    <div class="deco-secondary n12"></div>
    <header>
      <h1 data-i18n="home.pastChallenges">Défis passés</h1>
    </header>

    <section class="game-area">
      <div style="width:min(700px, 100%);">
        <a href="index.html" class="back-button" data-i18n="common.backHome">← Retour</a>

        <div class="center-card" style="max-width: 700px;">
          <div class="hist-tabs" role="tablist" aria-label="Daily et Weekly">
            <button class="hist-tab-btn active" id="tabDailyBtn" role="tab" data-i18n="oldDaily.tabDaily">Daily</button>
            <button class="hist-tab-btn" id="tabWeeklyBtn" role="tab" data-i18n="oldDaily.tabWeekly">Weekly</button>
          </div>

        <div id="dailiesContainer" class="daily-grid"></div>
        <nav id="dailyPagination" class="daily-pagination hidden" aria-label="Pagination des daily"></nav>
        <div id="weekliesContainer" class="daily-grid" style="display:none;"></div>
        <nav id="weeklyPagination" class="daily-pagination hidden" aria-label="Pagination des weekly"></nav>

          <div id="noDailies" class="no-dailies hidden" data-i18n="oldDaily.noChallenge">
            Aucun défi trouvé pour le moment.
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="notifications"></div>

  <script src="js/core/preferences.js"></script>
  <script src="js/ui/loader.js"></script>
  <script src="js/i18n/translate.js"></script>
  <script src="js/i18n/language-switcher.js"></script>
  <script src="js/ui/footer.js"></script>
  <script src="js/i18n/setup.js"></script>
  <script src="js/data/migration.js"></script>
  <script src="js/core/pokemon.js"></script>
  <script src="js/data/challenge-storage.js"></script>
  <script src="js/data/config.js"></script>
  <script src="js/features/settings/cosmetics.js"></script>
  <script src="js/ui/fx.js"></script>
  <script src="js/features/history/old-daily.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
