<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Révélation de la clé Steam découpée -->
        <div class="key-display" id="keyDisplay"></div>

        <!-- Indice (jaune) ou Sentence (blanc) -->
        <div class="message-box">
            <div class="message-text" id="messageText">...</div>
        </div>

        <!-- Gros input centralisé -->
        <div class="input-wrapper">
            <input 
                type="text" 
                id="vaultInput" 
                class="vault-input" 
                placeholder="UN SEUL MOT..." 
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="off" 
                spellcheck="false" 
                autofocus
            />
        </div>
    </div>
    <script src="vault.js"></script>
</body>
</html>
