<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Palworld → Discord</title>
  <style>
    body { font-family: Inter, Roboto, Arial, sans-serif; background:#0f1724; color:#e6eef8; margin:0; padding:24px; }
    .container { max-width:900px; margin:0 auto; background:#0b1220; border:1px solid #172033; padding:20px; border-radius:10px; box-shadow:0 6px 30px rgba(2,6,23,0.6); }
    h1 { margin:0 0 12px 0; font-size:20px; color:#9be7c4; }
    label { display:block; margin-top:12px; font-size:13px; color:#bcd8d1; }
    input[type="text"], input[type="password"], select, textarea { width:100%; padding:8px 10px; margin-top:6px; border-radius:6px; border:1px solid #22303f; background:#07101a; color:#e6eef8; box-sizing:border-box; }
    button { margin-top:14px; padding:10px 14px; border-radius:8px; border:0; background:#2ecc71; color:#042017; font-weight:600; cursor:pointer; }
    .row { display:flex; gap:12px; }
    .col { flex:1; }
    pre { background:#07101a; padding:12px; border-radius:8px; overflow:auto; color:#cfeee0; border:1px solid #12202a; max-height:360px; }
    .small { font-size:13px; color:#9fb7b0; margin-top:6px; }
    .ok { color:#8ef0a0; }
    .err { color:#ff9b9b; }
    .inline-field { display:inline-block; margin-right:8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Palworld → Discord (bouton)</h1>

    <label>Base URL (ex: http://tocosserie.dat.airforce:29814)</label>
    <input id="baseUrl" type="text" value="http://tocosserie.dat.airforce:29814" />

    <div class="row">
      <div class="col">
        <label>Méthode d'auth</label>
        <select id="authMethod">
          <option value="basic">Basic auth (admin:password)</option>
          <option value="header">Header AdminPassword</option>
        </select>
      </div>
      <div class="col">
        <label>Admin Password</label>
        <input id="adminPassword" type="password" value="-snvnC5AMAs" />
      </div>
    </div>

    <label>Discord Webhook URL</label>
    <input id="webhook" type="text" value="https://discord.com/api/webhooks/1525173554365206639/aeJV25wNsKtK6q9_2oYjvVd2VRAzVcjbhojRjvdEt2_HDaeFzdeddWVcU9R2JLrdWgW8" />

    <div style="display:flex; gap:10px; align-items:center;">
      <button id="sendBtn">Envoyer vers Discord</button>
      <div id="status" class="small">Prêt</div>
    </div>

    <label>Debug / Résultat</label>
    <pre id="log">Logs affichés ici...</pre>

    <div class="small">Remarques : si le navigateur bloque les requêtes vers ton serveur (CORS), exécute la page depuis une machine ayant accès au serveur ou configure CORS côté serveur.</div>
  </div>

  <script>
    // Mapping technique -> libellé lisible
    const METRIC_LABELS = {
      "currentplayernum": "Nombre de joueurs",
      "serverfps": "FPS serveur",
      "serverfpsaverage": "FPS moyen",
      "serverframetime": "Temps de frame (ms)",
      "days": "Jours",
      "maxplayernum": "Capacité max joueurs",
      "basecampnum": "Nombre de basecamps",
      "uptime": "Uptime",
    };

    const sendBtn = document.getElementById('sendBtn');
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');

    function log(...args) {
      const t = new Date().toISOString().replace('T',' ').replace('Z','');
      logEl.textContent = t + '  ' + args.map(a => (typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a))).join(' ') + '\n' + logEl.textContent;
    }

    function humanizeUptime(seconds) {
      if (seconds === null || seconds === undefined) return 'N/A';
      const s = Math.floor(Number(seconds) || 0);
      const days = Math.floor(s / 86400);
      let rem = s % 86400;
      const hours = Math.floor(rem / 3600);
      rem = rem % 3600;
      const minutes = Math.floor(rem / 60);
      const secs = rem % 60;
      const parts = [];
      if (days) parts.push(days + 'j');
      if (hours) parts.push(hours + 'h');
      if (minutes) parts.push(minutes + 'm');
      parts.push(secs + 's');
      return parts.join(' ');
    }

    function round2(v) {
      const n = Number(v);
      if (isNaN(n)) return String(v);
      return n.toFixed(2);
    }

    function fpsWithPercent(v, base = 60) {
      const n = Number(v);
      if (isNaN(n)) return String(v);
      const pct = Math.round((n / base) * 100);
      return `${Math.round(n)} (${pct}%)`;
    }

    async function fetchJson(url, options = {}) {
      const r = await fetch(url, options);
      const text = await r.text();
      let json = null;
      try { json = JSON.parse(text); } catch(e) { json = text; }
      return { status: r.status, headers: Object.fromEntries(r.headers.entries()), body: json, rawText: text };
    }

    function buildEmbed(playersResp, metricsResp, infoResp) {
      // Info -> title/description
      const info = (infoResp && infoResp.body && typeof infoResp.body === 'object') ? infoResp.body : {};
      const servername = info.servername || 'Palworld';
      const description = info.description || '';
      const version = info.version || '';

      const title = version ? `${servername} — ${version}` : servername;
      const desc = description || '';

      const fields = [];

      // Players
      let playerNames = [];
      if (playersResp && playersResp.body && Array.isArray(playersResp.body.players)) {
        playerNames = playersResp.body.players.map(p => (p && (p.name || p.accountName)) ? (p.name || p.accountName) : (p.playerId || 'inconnu'));
      }
      if (playerNames.length) {
        const displayLimit = 12;
        const shown = playerNames.slice(0, displayLimit);
        const more = playerNames.length - shown.length;
        let playersValue = shown.join(', ');
        if (more > 0) playersValue += `, et ${more} autres...`;
        fields.push({ name: '🎮 Joueurs', value: playersValue, inline: false });
      } else {
        const msg = (playersResp && playersResp.status === 200) ? 'Aucun joueur connecté' : `Erreur: ${playersResp ? playersResp.status : 'no response'}`;
        fields.push({ name: '🎮 Joueurs', value: msg, inline: false });
      }

      // Metrics
      const metrics = (metricsResp && metricsResp.body && typeof metricsResp.body === 'object') ? metricsResp.body : {};
      const order = ['currentplayernum','serverfps','serverfpsaverage','serverframetime','uptime'];
      const handled = new Set();
      for (const key of order) {
        if (key in metrics) {
          let val = metrics[key];
          let display;
          if (key === 'currentplayernum') display = String(val);
          else if (key === 'serverfps') display = fpsWithPercent(val, 60);
          else if (key === 'serverfpsaverage') display = round2(val);
          else if (key === 'serverframetime') display = round2(val);
          else if (key === 'uptime') display = humanizeUptime(val);
          else display = String(val);
          const label = METRIC_LABELS[key] || key;
          fields.push({ name: `📊 ${label}`, value: display, inline: true });
          handled.add(key);
        }
      }
      for (const [k,v] of Object.entries(metrics)) {
        if (handled.has(k)) continue;
        const label = METRIC_LABELS[k] || k;
        fields.push({ name: `📊 ${label}`, value: String(v), inline: true });
      }

      // Minimal raw info
      if (info && info.worldguid) {
        fields.push({ name: 'ℹ️ Info (raw)', value: `worldguid: ${info.worldguid}`, inline: false });
      }

      const embed = {
        title: title,
        description: desc,
        color: 0x1ABC9C,
        fields: fields,
        timestamp: new Date().toISOString(),
        footer: { text: 'Palworld API Monitor' }
      };
      return embed;
    }

    async function onSend() {
      const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/+$/, '');
      const webhook = document.getElementById('webhook').value.trim();
      const adminPassword = document.getElementById('adminPassword').value;
      const authMethod = document.getElementById('authMethod').value;

      if (!baseUrl || !webhook) {
        alert('Remplis la base URL et le webhook.');
        return;
      }

      statusEl.textContent = 'Interrogation API...';
      log('Démarrage: interrogation des endpoints');

      // Prepare headers
      const commonHeaders = { 'Accept': 'application/json' };
      if (authMethod === 'header') {
        commonHeaders['AdminPassword'] = adminPassword;
      } else if (authMethod === 'basic') {
        const token = btoa('admin:' + adminPassword);
        commonHeaders['Authorization'] = 'Basic ' + token;
      }

      // Fetch endpoints in parallel
      const endpoints = ['/v1/api/players','/v1/api/metrics','/v1/api/info'];
      const promises = endpoints.map(ep => {
        const url = baseUrl + ep;
        return fetchJson(url, { method: 'GET', headers: commonHeaders }).catch(e => ({ status: null, error: String(e) }));
      });

      const [playersResp, metricsResp, infoResp] = await Promise.all(promises);
      log('/players ->', playersResp.status, playersResp.body && (playersResp.body.players ? `players:${playersResp.body.players.length}` : 'body'));
      log('/metrics ->', metricsResp.status, metricsResp.body);
      log('/info ->', infoResp.status, infoResp.body);

      // Build embed (do NOT include baseUrl)
      const embed = buildEmbed(playersResp, metricsResp, infoResp);
      const payload = { embeds: [embed] };

      // Debug: show payload truncated
      log('Payload embed (truncated):', JSON.stringify(payload).slice(0, 2000));

      statusEl.textContent = 'Envoi vers Discord...';
      try {
        const resp = await fetch(webhook, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const text = await resp.text();
        log('Discord response status:', resp.status);
        log('Discord response headers:', Object.fromEntries(resp.headers.entries()));
        log('Discord response body:', text.slice(0,2000));
        if (resp.status === 204 || resp.status === 200) {
          statusEl.textContent = 'Envoyé ✓';
          statusEl.className = 'small ok';
        } else if (resp.status === 429) {
          statusEl.textContent = 'Rate limited (429)';
          statusEl.className = 'small err';
        } else {
          statusEl.textContent = 'Erreur envoi: ' + resp.status;
          statusEl.className = 'small err';
        }
      } catch (e) {
        log('Erreur réseau en envoyant au webhook:', String(e));
        statusEl.textContent = 'Erreur réseau';
        statusEl.className = 'small err';
      }
    }

    sendBtn.addEventListener('click', () => {
      sendBtn.disabled = true;
      onSend().finally(() => { sendBtn.disabled = false; });
    });
  </script>
</body>
</html>
