<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur TCG - Full Art Advanced Foil</title>
  
  <!-- Chargement des polices Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600;800&family=Montserrat:ital,wght@0,500;0,800;1,400&family=Orbitron:wght@600;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="./styles/base.css">
</head>
<body>

<div class="container">
  <!-- Formulaire -->
  <div class="form-container">
    <div class="form-group">
      <label for="input-title">Nom de la carte</label>
      <input type="text" id="input-title" value="Dragon Céleste" placeholder="Ex: Dragon Céleste">
    </div>

    <div class="form-group">
      <label for="input-series">Série / Set</label>
      <input type="text" id="input-series" value="Origines #001" placeholder="Ex: Set Alpha - 01">
    </div>

    <div class="form-group">
      <label for="input-font">Police de caractère</label>
      <select id="input-font">
        <option value="'Montserrat', sans-serif" data-class="">Montserrat (Moderne)</option>
        <option value="'Press Start 2P', cursive" data-class="font-pixel">Press Start 2P (Pixel)</option>
        <option value="'Cinzel', serif" data-class="">Cinzel (Fantasy / Médiéval)</option>
        <option value="'Orbitron', sans-serif" data-class="">Orbitron (Futuriste)</option>
        <option value="'Bebas Neue', cursive" data-class="">Bebas Neue (Arcade / Comics)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="input-rarity">Rareté & Style</label>
      <select id="input-rarity">
        <option value="★" data-class="rarity-common">Commune (★)</option>
        <option value="★★" data-class="rarity-rare">Rare (★★)</option>
        <option value="★★★" data-class="rarity-super-rare">Super Rare (★★★)</option>
        <option value="✦" data-class="rarity-legendary">Légendaire (✦)</option>
        <option value="💎" data-class="rarity-mythic">Mythique (💎)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="input-layout">Type de carte</label>
      <select id="input-layout">
        <option value="fullart" selected>Full Art</option>
        <option value="classic">Classique</option>
      </select>
    </div>

    <div class="form-group">
      <label for="input-image">URL de l'image de fond</label>
      <input type="text" id="input-image" value="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800" placeholder="https://...">
    </div>

    <div class="form-group">
      <label for="input-underlay">URL de l'image Underlay (Pixel Art)</label>
      <input type="text" id="input-underlay" value="" placeholder="https://... (ex: sprite / pixel art)">
    </div>

    <div class="form-group">
      <label for="input-text">Description / Effet</label>
      <textarea id="input-text" rows="3" placeholder="Description de la carte...">Invoque une tempête cosmique lorsqu'il entre sur le terrain. Inflige 50 points de dégâts aux unités adverses.</textarea>
    </div>

    <div class="form-group" style="margin-top: 6px;">
      <a href="./bulkgenerate.html" style="color: #7289da; font-size: 0.85rem; font-weight: 600; text-decoration: none;">🚀 Passer au Bulk Generator (Génération en lot) →</a>
    </div>

    <button id="download-btn">Télécharger la carte</button>
  </div>

  <!-- Aperçu Carte -->
  <div class="card-preview" id="card">
    <div class="card-inner">
      <div class="card-art" id="card-art"></div>
      <div class="card-foil-bg"></div>
      <div class="card-underlay" id="card-underlay"></div>
      <div class="card-foil-underlay"></div>
      
      <div class="card-header">
        <div class="card-title-container">
          <span class="card-title" id="card-title">Dragon Céleste</span>
          <span class="card-series" id="card-series">Origines #001</span>
        </div>
        <span class="card-rarity" id="card-rarity">★</span>
      </div>

      <div class="card-body">
        <p class="card-text" id="card-text"></p>
      </div>
    </div>
  </div>
</div>

<script src="./js/render/FontEmbedder.js"></script>
<script src="./js/render/SvgDomRenderer.js"></script>
<script src="./js/cardmaker.js"></script>

</body>
</html>
