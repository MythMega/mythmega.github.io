<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Galerie</title>
<style>
  :root{
    --img-size:96px;
    --wrap-padding:6px;
    --border-radius:6px;
    --border-width:1px;
    --gap:8px; /* gap fixe entre bordures */
    --gold-rgba: 255, 215, 0;
    /* largeur et hauteur totales d'une cellule (image + padding + bordure) */
    --wrap-total-width: calc(var(--img-size) + (var(--wrap-padding) * 2) + (var(--border-width) * 2));
    --wrap-total-height: calc(var(--img-size) + (var(--wrap-padding) * 2) + (var(--border-width) * 2));
  }

  html,body{height:100%;margin:0;padding:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:#fff;}

  /* container : ne plus forcer la hauteur à 100vh pour éviter l'étirement vertical */
  #gallery{
    box-sizing:border-box;
    width:100%;
    /* min-height retiré pour empêcher la grille de s'étirer verticalement */
    display:flex;
    gap:var(--gap);
    align-items:flex-start;
    justify-content:center;
    padding:12px;
  }

  /* each badge section */
  .img-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:var(--wrap-padding);
    border:var(--border-width) solid rgba(0,0,0,0.6);
    border-radius:var(--border-radius);
    background:transparent;
    box-sizing:border-box;
    margin:0;
    flex: 0 0 auto; /* prevent flex items from growing */
    width: var(--wrap-total-width);
    height: var(--wrap-total-height);
    overflow:visible;
  }

  /* image : drop-shadow respecte la transparence du PNG */
  .img-wrap img{
    width:var(--img-size);
    height:var(--img-size);
    image-rendering:pixelated;
    display:block;
    transition:filter .18s ease, opacity .18s ease, transform .18s ease;
    -webkit-user-drag: none;
    user-select: none;
    position:relative;
    z-index:1;
    border-radius:4px;
    background:transparent;
    /* ombre adaptée au contour du PNG */
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.95));
  }

  /* not obtained : silhouette noire + 50% alpha, ombre plus douce */
  .img-wrap.not-obtained img{
    filter: brightness(0) saturate(100%) drop-shadow(0 4px 10px rgba(0,0,0,0.25));
    opacity:0.5;
  }

  /* obtained : aura dorée sur pseudo-élément */
  .img-wrap.obtained{
    border-color: rgba(var(--gold-rgba),0.95);
  }
  .img-wrap.obtained::after{
    content:'';
    position:absolute;
    inset: -10px;
    border-radius: calc(var(--border-radius) + 10px);
    pointer-events:none;
    z-index:0;
    box-shadow:
      0 0 6px 2px rgba(var(--gold-rgba),0.55),
      0 0 18px 6px rgba(var(--gold-rgba),0.28),
      0 0 36px 12px rgba(var(--gold-rgba),0.12);
  }

  /* formats */
  .format-line #gallery{
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    gap:var(--gap);
    padding-bottom:12px;
  }
  .format-line .img-wrap{
    min-width:var(--wrap-total-width);
    width:var(--wrap-total-width);
  }

  .format-column #gallery{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:var(--gap);
  }
  .format-column .img-wrap{
    width:var(--wrap-total-width);
    max-width:var(--wrap-total-width);
  }

  /* format-block : EXACTEMENT 4 colonnes fixes et lignes de hauteur fixe identique à la largeur */
  .format-block #gallery{
    display:grid;
    grid-template-columns: repeat(4, var(--wrap-total-width)); /* 4 colonnes fixes */
    column-gap: var(--gap);
    row-gap: var(--gap); /* même gap vertical que horizontal */
    grid-auto-rows: var(--wrap-total-height); /* force la hauteur de chaque ligne */
    justify-content:center; /* centre la grille sans étirer les colonnes */
    align-content:start; /* évite que la grille s'étire verticalement pour remplir l'espace */
  }
  .format-block .img-wrap{
    width:var(--wrap-total-width);
    max-width:var(--wrap-total-width);
    height:var(--wrap-total-height);
  }

  /* responsive : sur très petit écran, passe à 2 colonnes en block */
  @media (max-width:640px){
    .format-block #gallery{
      grid-template-columns: repeat(2, var(--wrap-total-width));
    }
    .format-line #gallery{
      display:grid;
      grid-template-columns:repeat(2,var(--wrap-total-width));
      gap:var(--gap);
      overflow:auto;
    }
  }

  #app{ box-sizing:border-box; padding:0; }

  .img-wrap:focus{ outline:2px solid rgba(0,0,0,0.12); outline-offset:2px; }
</style>
</head>
<body>
  <div id="app" class="format-block" style="min-height:100vh;">
    <div id="gallery" aria-live="polite"></div>
  </div>

<script>
/* script inchangé (reprise de ta logique précédente) */
const SPREADSHEET_ID = '1aITdV5Y0T62FrWDHLWZIT5h8fHilm7Zss9fEuEAWDFE';
const RANGE = 'D2:D9';
const POLL_INTERVAL_MS = 7000;

const IMAGES = [
  { cell: 'D2', url: 'https://www.pokepedia.fr/images/thumb/3/32/Badge_Roche_Hoenn_ROSA.png/40px-Badge_Roche_Hoenn_ROSA.png' },
  { cell: 'D3', url: 'https://www.pokepedia.fr/images/thumb/e/e0/Badge_Poing_Hoenn_ROSA.png/40px-Badge_Poing_Hoenn_ROSA.png' },
  { cell: 'D4', url: 'https://www.pokepedia.fr/images/thumb/6/67/Badge_Dynamo_Hoenn_ROSA.png/40px-Badge_Dynamo_Hoenn_ROSA.png' },
  { cell: 'D5', url: 'https://www.pokepedia.fr/images/thumb/3/39/Badge_Chaleur_Hoenn_ROSA.png/40px-Badge_Chaleur_Hoenn_ROSA.png' },
  { cell: 'D6', url: 'https://www.pokepedia.fr/images/thumb/5/59/Badge_Balancier_Hoenn_ROSA.png/40px-Badge_Balancier_Hoenn_ROSA.png' },
  { cell: 'D7', url: 'https://www.pokepedia.fr/images/thumb/4/42/Badge_Plume_Hoenn_ROSA.png/40px-Badge_Plume_Hoenn_ROSA.png' },
  { cell: 'D8', url: 'https://www.pokepedia.fr/images/thumb/6/66/Badge_Esprit_Hoenn_ROSA.png/40px-Badge_Esprit_Hoenn_ROSA.png' },
  { cell: 'D9', url: 'https://www.pokepedia.fr/images/thumb/3/3f/Badge_Pluie_Hoenn_ROSA.png/40px-Badge_Pluie_Hoenn_ROSA.png' }
];

const gallery = document.getElementById('gallery');
const app = document.getElementById('app');

function buildGallery(){
  gallery.innerHTML = '';
  IMAGES.forEach((it, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'img-wrap';
    wrap.dataset.index = idx;
    wrap.dataset.cell = it.cell;
    wrap.setAttribute('role','img');
    wrap.setAttribute('aria-label', `Badge ${it.cell}`);
    const img = document.createElement('img');
    img.alt = '';
    img.src = it.url;
    img.draggable = false;
    img.loading = 'lazy';
    wrap.appendChild(img);
    gallery.appendChild(wrap);
  });
}

function applyFormatFromQuery(){
  const params = new URLSearchParams(location.search);
  const fmt = (params.get('format') || 'block').toLowerCase();
  app.classList.remove('format-line','format-column','format-block');
  if(fmt === 'line') app.classList.add('format-line');
  else if(fmt === 'column') app.classList.add('format-column');
  else app.classList.add('format-block');
}

function parseGvizJson(text){
  const start = text.indexOf('(');
  const end = text.lastIndexOf(')');
  if(start === -1 || end === -1) return null;
  try{ return JSON.parse(text.slice(start+1,end)); }catch(e){ console.warn('parseGvizJson error', e); return null; }
}

async function fetchSheetValues(){
  const gvizUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?range=${encodeURIComponent(RANGE)}&tqx=out:json`;
  try{
    const res = await fetch(gvizUrl, {cache:'no-store'});
    const text = await res.text();
    console.debug('[GVIZ RAW]', text.slice(0,1000));
    if(!res.ok) throw new Error('gviz non ok');
    const parsed = parseGvizJson(text);
    if(parsed && parsed.table && Array.isArray(parsed.table.rows)){
      const rows = parsed.table.rows.map(r => (r.c && r.c[0] && r.c[0].v !== undefined) ? String(r.c[0].v) : '');
      console.debug('[GVIZ PARSED VALUES]', rows);
      return rows;
    } else {
      console.debug('[GVIZ] parsed but no table.rows', parsed);
    }
  }catch(err){
    console.warn('[GVIZ FETCH FAILED]', err);
  }

  try{
    const csvUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&range=${encodeURIComponent(RANGE)}`;
    const res2 = await fetch(csvUrl, {cache:'no-store'});
    const csvText = await res2.text();
    console.debug('[CSV RAW]', csvText.slice(0,1000));
    if(!res2.ok) throw new Error('csv non ok');
    const lines = csvText.split(/\r?\n/).slice(0,IMAGES.length);
    while(lines.length < IMAGES.length) lines.push('');
    const trimmed = lines.map(s => s.trim());
    console.debug('[CSV PARSED VALUES]', trimmed);
    return trimmed;
  }catch(err){
    console.error('[CSV FETCH FAILED]', err);
    return null;
  }
}

function applyValues(values){
  if(!Array.isArray(values)) return;
  console.groupCollapsed('[APPLY VALUES] cell values check');
  IMAGES.forEach((it, idx) => {
    const wrap = gallery.querySelector(`.img-wrap[data-index="${idx}"]`);
    if(!wrap) return;
    const raw = values[idx];
    const val = (raw === undefined || raw === null) ? '' : String(raw);
    const trimmed = val.trim();
    console.log(`Cell ${it.cell} -> raw:`, raw, '| typeof:', typeof raw, '| string:', `"${val}"`, '| trimmed:', `"${trimmed}"`, '| equals "false"?', trimmed === 'false');

    if(trimmed === 'false'){
      wrap.classList.add('not-obtained');
      wrap.classList.remove('obtained','bw');
      wrap.setAttribute('aria-checked','false');
    } else if(trimmed !== ''){
      wrap.classList.add('obtained');
      wrap.classList.remove('not-obtained','bw');
      wrap.setAttribute('aria-checked','true');
    } else {
      wrap.classList.remove('not-obtained','obtained','bw');
      wrap.removeAttribute('aria-checked');
    }
  });
  console.groupEnd();
}

let lastValues = null;
async function pollAndUpdate(){
  const values = await fetchSheetValues();
  if(!values) return;
  console.info('[POLL] values array:', values);
  if(JSON.stringify(values) !== JSON.stringify(lastValues)){
    applyValues(values);
    lastValues = values;
  } else {
    console.debug('[POLL] pas de changement détecté');
  }
}

(function init(){
  buildGallery();
  applyFormatFromQuery();
  pollAndUpdate();
  setInterval(pollAndUpdate, POLL_INTERVAL_MS);
  window.addEventListener('popstate', applyFormatFromQuery);
  window.addEventListener('hashchange', applyFormatFromQuery);
  document.addEventListener('dragstart', e => { if(e.target && e.target.tagName === 'IMG') e.preventDefault(); });
})();
</script>
</body>
</html>
