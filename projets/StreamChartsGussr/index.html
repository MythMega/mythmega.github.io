<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StreamGuessr — devine le temps de stream des jeux Twitch, à partir des données de SullyGnome." />
  <title>StreamGuessr</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header class="site-header aero">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">SG</span>
      <span class="brand-text">
        <strong data-i18n="app.name"></strong>
        <small data-i18n="app.tagline"></small>
      </span>
    </a>
    <nav class="header-actions">
      <a class="icon-btn" href="settings.html"
         data-i18n-title="nav.settings" data-i18n-aria-label="nav.settings"
         aria-label="Réglages" title="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </nav>
  </header>

  <main class="page-wrap index-page">
    <section class="hero reveal-on-load">
      <h1 data-i18n="index.title"></h1>
      <p class="lead" data-i18n="index.subtitle"></p>
    </section>

    <section class="setup-card aero reveal-on-load">
      <label class="field-label" for="streamerInput" data-i18n="index.pseudoLabel"></label>
      <div class="input-row">
        <input id="streamerInput" class="input" type="text"
               autocomplete="off" spellcheck="false" autocapitalize="none"
               data-i18n-placeholder="index.pseudoPlaceholder" />
      </div>

      <button id="replayBtn" class="btn ghost replay-btn" type="button" hidden></button>

      <p class="field-label mode-label" data-i18n="index.modeTitle"></p>
      <div class="mode-grid">
        <button type="button" class="mode-card aero" data-mode="classic" aria-pressed="false">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <circle cx="12" cy="12" r="4"></circle>
              <circle cx="12" cy="12" r="0.6" fill="currentColor"></circle>
            </svg>
          </span>
          <span class="mode-title" data-i18n="index.modeClassicTitle"></span>
          <span class="mode-desc" data-i18n="index.modeClassicDesc"></span>
        </button>

        <button type="button" class="mode-card aero" data-mode="compare" aria-pressed="false">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="6" x2="5" y2="18"></line>
              <line x1="5" y1="12" x2="1" y2="12"></line>
              <line x1="13" y1="6" x2="13" y2="18"></line>
              <line x1="13" y1="12" x2="9" y2="12"></line>
              <line x1="19" y1="5" x2="19" y2="19"></line>
              <line x1="19" y1="12" x2="23" y2="12"></line>
            </svg>
          </span>
          <span class="mode-title" data-i18n="index.modeCompareTitle"></span>
          <span class="mode-desc" data-i18n="index.modeCompareDesc"></span>
        </button>

        <button type="button" class="mode-card aero" data-mode="top" aria-pressed="false">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
              <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
              <path d="M4 22h16"></path>
              <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
              <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
              <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
            </svg>
          </span>
          <span class="mode-title" data-i18n="index.modeTopTitle"></span>
          <span class="mode-desc" data-i18n="index.modeTopDesc"></span>
        </button>
      </div>

      <div id="difficultySection" class="difficulty-section" hidden>
        <p class="field-label" data-i18n="index.difficultyTitle"></p>
        <div class="difficulty-grid">
          <button type="button" class="difficulty-card" data-difficulty="easy" aria-pressed="false">
            <span class="difficulty-name" data-i18n="index.difficultyEasy"></span>
            <span class="difficulty-detail" data-i18n="index.difficultyEasyDetail"></span>
          </button>
          <button type="button" class="difficulty-card" data-difficulty="medium" aria-pressed="false">
            <span class="difficulty-name" data-i18n="index.difficultyMedium"></span>
            <span class="difficulty-detail" data-i18n="index.difficultyMediumDetail"></span>
          </button>
          <button type="button" class="difficulty-card" data-difficulty="hard" aria-pressed="false">
            <span class="difficulty-name" data-i18n="index.difficultyHard"></span>
            <span class="difficulty-detail" data-i18n="index.difficultyHardDetail"></span>
          </button>
        </div>
      </div>

      <label class="toggle-row" for="extendedToggle">
        <input id="extendedToggle" type="checkbox" class="toggle" />
        <span class="toggle-slider"></span>
        <span class="toggle-label" data-i18n="index.extendedData"></span>
      </label>
      <p class="settings-desc" data-i18n="index.extendedDataHint"></p>

      <button id="playBtn" class="btn primary play-btn" type="button" data-i18n="index.play"></button>
      <p id="cacheInfo" class="cache-info" hidden></p>
    </section>

    <p class="data-hint reveal-on-load" data-i18n="index.dataHint"></p>
  </main>

  <script type="module" src="scripts/ui/index-page.js"></script>
</body>
</html>
