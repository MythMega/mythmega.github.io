<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fdf6ec" />
  <title data-i18n="settings_title">Settings</title>
  <link rel="icon" type="image/png" href="assets/img/cat_icon.png" />
  <link rel="apple-touch-icon" href="assets/img/cat_icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="theme-light">
  <header class="topbar">
    <a class="icon-btn" href="index.html" data-i18n-aria="home" aria-label="Home">🏠</a>
    <span class="topbar__title" data-i18n="settings_title">Settings</span>
    <span class="icon-btn" aria-hidden="true" style="visibility:hidden">⚙️</span>
  </header>

  <main class="screen">
    <p class="muted" data-i18n="settings_intro">Your choices are saved on this device.</p>

    <section class="card">
      <div class="field">
        <span class="field__label" id="labelLang" data-i18n="language">Language</span>
        <div class="segmented" role="radiogroup" aria-labelledby="labelLang">
          <input type="radio" name="lang" id="lang-fr" value="fr" />
          <label for="lang-fr">Français</label>
          <input type="radio" name="lang" id="lang-es" value="es" />
          <label for="lang-es">Español</label>
          <input type="radio" name="lang" id="lang-en" value="en" />
          <label for="lang-en">English</label>
        </div>
      </div>

      <div class="field">
        <span class="field__label" id="labelTheme" data-i18n="theme">Theme</span>
        <div class="segmented" role="radiogroup" aria-labelledby="labelTheme">
          <input type="radio" name="theme" id="theme-light" value="light" />
          <label for="theme-light" data-i18n="light">Light</label>
          <input type="radio" name="theme" id="theme-dark" value="dark" />
          <label for="theme-dark" data-i18n="dark">Dark</label>
        </div>
      </div>

      <div class="field">
        <span class="field__label" id="labelSound" data-i18n="sounds">Sounds</span>
        <div class="segmented" role="radiogroup" aria-labelledby="labelSound">
          <input type="radio" name="sound" id="sound-on" value="on" />
          <label for="sound-on" data-i18n="on">On</label>
          <input type="radio" name="sound" id="sound-off" value="off" />
          <label for="sound-off" data-i18n="off">Off</label>
        </div>
      </div>

      <div class="field">
        <span class="field__label" id="labelNotes" data-i18n="notes_toggle">Auto notes</span>
        <div class="segmented" role="radiogroup" aria-labelledby="labelNotes">
          <input type="radio" name="notes" id="notes-on" value="on" />
          <label for="notes-on" data-i18n="on">On</label>
          <input type="radio" name="notes" id="notes-off" value="off" />
          <label for="notes-off" data-i18n="off">Off</label>
        </div>
        <p class="muted" data-i18n="notes_desc">Off by default.</p>
      </div>
    </section>

    <a class="btn btn--primary btn--block" href="index.html" data-i18n="back_home">Back to home</a>
    <a class="btn btn--ghost btn--block" href="play.html" data-i18n="play">Play</a>
  </main>

  <script src="js/main.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
