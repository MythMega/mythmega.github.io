<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#060c18" />
  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="Pokefeet" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pokefeet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <title>Pokefeet — Weekly Challenge</title>
  <meta name="description" content="Pokefeet Weekly Challenge — Devinez 10 Pokémon chaque semaine en ne voyant que leurs pieds. Défi hebdomadaire renouvelé chaque lundi." />
  <meta name="keywords" content="Pokefeet, weekly challenge Pokémon, deviner Pokémon pieds, défi hebdomadaire Pokémon" />
  <meta name="author" content="MythMega" />
  <link rel="canonical" href="https://web.jmdev.fr/projets/pokefeet/weekly.html" />
  <link rel="alternate" href="https://web.jmdev.fr/projets/pokefeet/weekly.html" hreflang="fr" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://web.jmdev.fr/projets/pokefeet/weekly.html" />
  <meta property="og:title" content="Pokefeet — Weekly Challenge" />
  <meta property="og:description" content="Devinez 10 Pokémon chaque semaine en ne voyant que leurs pieds. Weekly challenge Pokémon." />
  <meta property="og:site_name" content="MythMega — jmdev" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Pokefeet — Weekly Challenge" />
  <meta name="twitter:description" content="Devinez 10 Pokémon chaque semaine en ne voyant que leurs pieds." />
  <link rel="icon" type="image/x-icon" href="./icon.png">
  <link rel="stylesheet" href="styles/main.css" />
  <script src="js/core/preferences.js"></script>
  <link rel="stylesheet" href="styles/cosmetics.css" />
  <link rel="stylesheet" href="styles/text-shadow.css" />
</head>
<body>
  <main id="app">
    <div class="deco n1"></div>
    <div class="deco n2"></div>
    <div class="deco n3"></div>
    <div class="deco n4"></div>
    <div class="deco-secondary n11"></div>
    <div class="deco-secondary n12"></div>
    <header>
      <h1 data-i18n="weekly.title">Pokefeet Weekly</h1>
      <i data-i18n="weekly.includes">10 Pokémon — renouvellement chaque lundi</i>
      <div class="scoreboard">
        <div class="round-gauge">
          <div class="round-dot" id="round-dot-0"></div>
          <div class="round-dot" id="round-dot-1"></div>
          <div class="round-dot" id="round-dot-2"></div>
          <div class="round-dot" id="round-dot-3"></div>
          <div class="round-dot" id="round-dot-4"></div>
          <div class="round-dot" id="round-dot-5"></div>
          <div class="round-dot" id="round-dot-6"></div>
          <div class="round-dot" id="round-dot-7"></div>
          <div class="round-dot" id="round-dot-8"></div>
          <div class="round-dot" id="round-dot-9"></div>
        </div>
        <div class="score-display"><span data-i18n="daily.score">Score</span> : <span id="weeklyScore">0</span></div>
      </div>
    </header>

    <section class="game-area">
      <div class="center-card">
        <div class="image-gauge-row">
          <div class="pokemon-image">
            <img id="weeklyImg" src="" alt="Pokémon" />
          </div>

          <div id="attemptGauge" class="attempt-gauge" aria-hidden="false">
            <div class="gauge-label">+10</div>
            <div class="gauge"><div class="gauge-fill" style="height:100%"></div></div>
          </div>
        </div>

        <div class="info-below">
          <div id="weeklyReveal" class="hidden">
            <div><span data-i18n="daily.generation">Génération</span> : <span id="wGen"></span></div>
            <div><span data-i18n="daily.index">Index</span> : <span id="wIndex"></span></div>
            <div><span data-i18n="daily.type1">Type 1</span> : <span id="wT1"></span></div>
            <div><span data-i18n="daily.type2">Type 2</span> : <span id="wT2"></span></div>
          </div>
          <div id="weeklyFailedAttempts" class="failed-attempts hidden" aria-live="polite"></div>
        </div>

        <div class="guess-area">
          <div class="autocomplete-wrap">
            <input id="weeklyInput" type="text" autocomplete="off"
                   data-i18n-attr="placeholder:daily.placeholder|aria-label:daily.placeholder"
                   placeholder="Tapez le nom FR ou EN" />
            <div id="weeklyNamesDropdown" class="autocomplete-dropdown hidden"></div>
          </div>
          <button id="weeklySubmit" data-tag="customizables-button" data-i18n="daily.submit">Valider</button>
          <button id="weeklySkip" class="secondary" data-tag="customizables-button" data-i18n="daily.skip">Passer</button>
        </div>

        <div id="newPokemonsAlert" class="hidden"
             style="background-color:#FFD700;color:#000;padding:10px;border-radius:8px;margin-bottom:10px;font-weight:bold;"></div>
        <div id="afterDone" class="hidden" style="margin-top:12px; text-align:left;">
          <h3 data-i18n="daily.gameComplete">Partie terminée</h3>
          <div id="shareTextArea"
               style="white-space:pre-wrap; font-family:monospace; background:rgba(255,255,255,0.03); padding:8px; border-radius:8px;"></div>
          <div id="weeklyFullImages" class="daily-full-images"
               style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;"></div>
          <button id="copyShare" data-i18n="daily.copy" data-tag="customizables-button">Copier</button>
          <button id="copyMiniShare" data-i18n="daily.copyMini" data-tag="customizables-button">Copie minifiée</button>
          <button id="copyDiscordShare" data-i18n="daily.shareDiscord" data-tag="customizables-button">Partager Discord</button>
          <button  id="viewDetails" data-i18n="daily.viewDetails" data-tag="customizables-button">Voir détails</button>
        </div>
      </div>
    </section>

    <aside id="hints">
      <h3>Indices</h3>
      <ul id="weeklyHints"></ul>
    </aside>

    <!-- Popup de révélation : Pokémon non trouvé (essais épuisés ou abandon) -->
    <div id="weeklyFailPopup" class="popup hidden" role="dialog" aria-modal="true" aria-labelledby="weeklyFailTitle">
      <div class="popup-content popup-scroll">
        <p id="weeklyFailTitle" class="popup-title" data-i18n="daily.answerWas">La réponse était</p>
        <h2 id="weeklyFailName" class="popup-name"></h2>
        <div class="popup-images">
          <div class="popup-image-item">
            <img id="weeklyFailFullImg" class="popup-full-img" src="" alt="" />
            <span class="popup-image-label" data-i18n="daily.fullSprite">Sprite complet</span>
          </div>
          <div class="popup-image-item">
            <img id="weeklyFailFootImg" class="popup-foot-img" src="" alt="" />
            <span class="popup-image-label" data-i18n="daily.footSprite">Pied</span>
          </div>
        </div>
        <h3 class="popup-hints-title" data-i18n="common.hints">Indices</h3>
        <ul id="weeklyFailHints" class="popup-hints"></ul>
        <div class="popup-footer">
          <button id="weeklyFailConfirm" data-i18n="daily.continue" data-tag="customizables-button">Continuer</button>
        </div>
      </div>
    </div>

    <div id="notifications" aria-live="polite"></div>
    <button id="retourBtn" class="secondary" style="padding:10px 12px;"
            data-i18n="common.backHome">Retour à l'accueil</button>
  </main>

  <script src="js/ui/loader.js"></script>
  <script src="js/i18n/translate.js"></script>
  <script src="js/i18n/language-switcher.js"></script>
  <script src="js/ui/footer.js"></script>
  <script src="js/i18n/setup.js"></script>
  <script src="js/core/pokemon.js"></script>
  <script src="js/data/pokemon-files.js"></script>
  <script src="js/data/migration.js"></script>
  <script src="js/data/dex.js"></script>
  <script src="js/core/pokemon-versions.js"></script>
  <script src="js/data/challenge-storage.js"></script>
  <script src="js/features/settings/cosmetics.js"></script>
  <script src="js/ui/fx.js"></script>
  <script src="js/ui/transitions.js"></script>
  <script src="js/ui/preload.js"></script>
  <script src="js/ui/zoom.js"></script>
  <script src="js/data/config.js"></script>
  <script src="js/ui/rotate3d.js"></script>
  <script src="js/features/weekly/weekly.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
